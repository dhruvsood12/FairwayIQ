# SwiftLint configuration. Correctness rules gate CI (run with --strict);
# pure formatting belongs to SwiftFormat. Thresholds are sized to this
# codebase's larger SwiftUI views so zero violations stays reachable.

excluded:
  - .build
  - .claude
  - DerivedData
  - scripts
  # Test code force-unwraps idiomatically in assertions; SwiftLint cannot
  # scope rules per path, so test trees are excluded from linting.
  - FairwayIQTests
  - Tests

opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - last_where
  - sorted_first_last
  - fatal_error_message

disabled_rules:
  # Button(action:) { } label: { } and friends make this rule noise in SwiftUI.
  - multiple_closures_with_trailing_closure
  - todo

force_unwrapping:
  severity: warning

opening_brace:
  # SwiftFormat wraps the brace after multiline if-let conditions onto its own
  # line; accept that placement so the two tools agree.
  ignore_multiline_statement_conditions: true

line_length:
  warning: 170
  error: 220
  ignores_urls: true
  ignores_comments: true

identifier_name:
  # Domain and design-token abbreviations: golf clubs (pw/gw/sw/lw), spacing
  # scale (xs/sm/md/lg/xl), coefficient of variation (cv).
  excluded: [x, y, d, i, id, db, pw, gw, sw, lw, xs, sm, md, lg, xl, cv]

large_tuple:
  warning: 3
  error: 5

function_parameter_count:
  warning: 6
  error: 8

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 800

function_body_length:
  warning: 170
  error: 250

cyclomatic_complexity:
  warning: 20
  error: 30

nesting:
  type_level: 2
